name: Intégration continue

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le formatage
        run: pnpm run format:verifie

      - name: Lint
        run: pnpm run lint

      - name: Types
        run: pnpm run typecheck

      # Les tests qui touchent la base et Redis tournent dans le travail « base », qui a les
      # services pour cela. Ici, seules les règles pures : elles doivent tenir sans rien autour.
      - name: Tests unitaires et couverture
        run: pnpm --filter @lerenom/core --filter @lerenom/securite run test:couverture

      - name: Build
        run: pnpm run build

  base:
    name: Schéma, démonstration et cascade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: lerenom
          POSTGRES_DB: lerenom
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:lerenom@127.0.0.1:5432/lerenom
      REDIS_URL: redis://127.0.0.1:6379
      SECRET_VERIFICATION: secret-dintegration-continue-strictement-jetable
      LERENOM_ENV: developpement

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @lerenom/db generer

      - name: Créer le schéma
        run: pnpm --filter @lerenom/db pousser

      - name: Poser les index PostGIS et les garde-fous
        run: psql "$DATABASE_URL" -f packages/db/prisma/sql/postgis.sql

      - name: Semer les référentiels et la démonstration
        run: pnpm --filter @lerenom/db semer

      - name: Vérifier les comptes attendus
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              n_communes int;
              n_univers int;
              n_metiers int;
              n_prestations int;
            BEGIN
              SELECT count(*) INTO n_communes FROM communes;
              SELECT count(*) INTO n_univers FROM univers;
              SELECT count(*) INTO n_metiers FROM metiers;
              SELECT count(*) INTO n_prestations FROM prestations;
              IF n_communes <> 1285 THEN
                RAISE EXCEPTION '1 285 communes attendues, % trouvées', n_communes;
              END IF;
              IF n_univers <> 18 OR n_metiers <> 69 OR n_prestations <> 479 THEN
                RAISE EXCEPTION 'Catalogue attendu 18/69/479, obtenu %/%/%',
                  n_univers, n_metiers, n_prestations;
              END IF;
            END
            \$\$;"

      # La cascade de distribution et le parcours de la demande, contre la vraie base et le vrai
      # Redis : c'est le seul endroit où l'on peut prouver qu'aucune demande ne part avant la
      # vérification du mobile, et qu'elle part bien juste après.
      - name: Tests d'intégration de la distribution et du suivi client
        run: pnpm --filter @lerenom/worker --filter @lerenom/web run test

      - name: Vérifier que les tests ne laissent aucune trace
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              n_distributions int;
              n_demandes int;
            BEGIN
              SELECT count(*) INTO n_distributions FROM distributions;
              SELECT count(*) INTO n_demandes
                FROM demandes WHERE client_telephone LIKE '%612000042'
                   OR client_telephone LIKE '%69999999%';
              IF n_distributions <> 0 THEN
                RAISE EXCEPTION '% distributions laissées derrière eux', n_distributions;
              END IF;
              IF n_demandes <> 0 THEN
                RAISE EXCEPTION '% demandes de test laissées derrière eux', n_demandes;
              END IF;
            END
            \$\$;"
